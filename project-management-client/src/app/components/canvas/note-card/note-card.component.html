<div
    class="note-card"
    [class.note-card--selected]="selected"
    [class.note-card--dragging]="amBeingDragged"
    [ngStyle]="cardStyle"
    (mousedown)="onMousedown($event)"
    (click)="onClick($event)"
>
    <div class="note-card__header">
        <i class="pi pi-file-edit note-card__icon"></i>
        <div class="note-card__title-wrap">
            @if (editingTitle) {
                <input
                    #titleInput
                    class="note-card__title note-card__title--editing"
                    [(ngModel)]="localTitle"
                    (blur)="commitTitle()"
                    (keydown.enter)="$event.preventDefault(); commitTitle()"
                    (keydown.escape)="cancelTitle()"
                    (mousedown)="$event.stopPropagation()"
                />
            } @else {
                <span class="note-card__title" (dblclick)="startEditTitle($event)">{{ localTitle }}</span>
                <button class="note-card__edit-hint" title="Edit title" (click)="startEditTitle($event)">
                    <i class="pi pi-pencil"></i>
                </button>
            }
        </div>
    </div>
    <div class="note-card__divider"></div>

    <div class="note-card__body-wrap" [ngStyle]="bodyStyle">
        @if (editingDetails) {
            <app-markdown-editor
                [value]="localDetails"
                (commit)="onDetailsCommit($event)"
                (cancel)="cancelDetails()"
            />
        } @else {
            <app-markdown-view class="note-card__body" [value]="localDetails" (dblclick)="startEditDetails($event)" />
            <button class="note-card__body-edit-hint" title="Edit details" (click)="startEditDetails($event)">
                <i class="pi pi-pencil"></i>
            </button>
        }
    </div>

    @for (handle of resizeHandles; track handle) {
        <div
            class="resize-handle resize-handle--{{ handle }}"
            (mousedown)="onResizeMousedown($event, handle)"
        ></div>
    }
</div>
