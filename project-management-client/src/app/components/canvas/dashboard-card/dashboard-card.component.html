<div class="dashboard-card" [class.dashboard-card--selected]="isSelected"
    [style.left.px]="localLayout.x"
    [style.top.px]="localLayout.y"
    [style.width.px]="localLayout.width"
    [style.height.px]="localLayout.height"
    [style.z-index]="localLayout.zIndex"
    (mousedown)="onBodyMousedown($event)">

    <!-- Header — drag handle -->
    <div class="dashboard-card__header" (mousedown)="onHeaderMousedown($event)">
        <span class="dashboard-card__title">{{ dashboard.title }}</span>
        <span class="dashboard-card__key">{{ dashboard.key }}</span>
        <div class="dashboard-card__actions">
            <button class="dashboard-card__action-btn pi pi-cog" pTooltip="Edit dashboard" tooltipPosition="top"
                (click)="openEditor(); $event.stopPropagation()"></button>
            <button class="dashboard-card__action-btn pi pi-chart-line" pTooltip="Manage metrics" tooltipPosition="top"
                (click)="openMetrics(); $event.stopPropagation()"></button>
            <button class="dashboard-card__action-btn pi pi-trash dashboard-card__action-btn--danger"
                pTooltip="Delete dashboard" tooltipPosition="top"
                (click)="deleteDashboard(); $event.stopPropagation()"></button>
        </div>
    </div>

    <!-- Widget list -->
    <div class="dashboard-card__body">
        <ng-container *ngFor="let widget of dashboard.config.widgets">
            <ng-container [ngSwitch]="widget.type">

                <app-widget-number *ngSwitchCase="'number'"
                    [widget]="widget" [dataDef]="getDataDef(widget.dataId)"
                    (valueChanged)="onWidgetValueChanged(widget, $event)"
                    (click)="$event.stopPropagation()">
                </app-widget-number>

                <app-widget-progress *ngSwitchCase="'progress'"
                    [widget]="widget" [dataDef]="getDataDef(widget.dataId)"
                    (valueChanged)="onWidgetValueChanged(widget, $event)"
                    (click)="$event.stopPropagation()">
                </app-widget-progress>

                <app-widget-status *ngSwitchCase="'status'"
                    [widget]="widget" [dataDef]="getDataDef(widget.dataId)"
                    (valueChanged)="onWidgetValueChanged(widget, $event)"
                    (click)="$event.stopPropagation()">
                </app-widget-status>

                <app-widget-text *ngSwitchCase="'text'"
                    [widget]="widget" [dataDef]="getDataDef(widget.dataId)"
                    (valueChanged)="onWidgetValueChanged(widget, $event)"
                    (click)="$event.stopPropagation()">
                </app-widget-text>

                <app-widget-list *ngSwitchCase="'list'"
                    [widget]="widget" [dataDef]="getDataDef(widget.dataId)"
                    (valueChanged)="onWidgetValueChanged(widget, $event)"
                    (click)="$event.stopPropagation()">
                </app-widget-list>

                <app-widget-toggle *ngSwitchCase="'toggle'"
                    [widget]="widget" [dataDef]="getDataDef(widget.dataId)"
                    (valueChanged)="onWidgetValueChanged(widget, $event)"
                    (click)="$event.stopPropagation()">
                </app-widget-toggle>

                <app-widget-gauge *ngSwitchCase="'gauge'"
                    [widget]="widget" [dataDef]="getDataDef(widget.dataId)"
                    (click)="$event.stopPropagation()">
                </app-widget-gauge>

            </ng-container>
        </ng-container>

        <div *ngIf="dashboard.config.widgets.length === 0" class="dashboard-card__empty">
            <i class="pi pi-chart-bar"></i>
            <span>No widgets — click <i class="pi pi-cog"></i> to configure</span>
        </div>
    </div>

    <!-- Resize handles -->
    <div class="resize-handle resize-handle--se" (pointerdown)="onResizeMousedown('se', $event)"></div>
    <div class="resize-handle resize-handle--e"  (pointerdown)="onResizeMousedown('e',  $event)"></div>
    <div class="resize-handle resize-handle--s"  (pointerdown)="onResizeMousedown('s',  $event)"></div>
</div>
