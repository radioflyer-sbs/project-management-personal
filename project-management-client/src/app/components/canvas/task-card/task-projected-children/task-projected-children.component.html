@if (children.length > 0) {
    <div class="projected-children" (mousedown)="$event.button === 0 && $event.stopPropagation()">
        <div class="projected-children__label">Sub-task progress</div>
        @for (child of children; track child._id) {
            <div class="projected-children__item" [style.--accent]="meta(child.urgency).color">
                <i class="pi {{ meta(child.urgency).icon }} projected-children__icon"></i>
                <span class="projected-children__title">{{ child.title }}</span>
            </div>
        }
    </div>
}
