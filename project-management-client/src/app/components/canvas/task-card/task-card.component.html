<div
    class="task-card"
    [ngClass]="[urgencyClass, selected ? 'task-card--selected' : '']"
    [ngStyle]="cardStyle"
    (mousedown)="onMousedown($event)"
    (click)="onClick($event)"
>
    <div class="task-card__header">
        @if (task.isComplete) {
            <i class="pi pi-check task-card__complete-icon"></i>
        }
        <div class="task-card__title-wrap">
            @if (editingTitle) {
                <input
                    #titleInput
                    class="task-card__title task-card__title--editing"
                    [(ngModel)]="localTitle"
                    (blur)="commitTitle()"
                    (keydown.enter)="$event.preventDefault(); commitTitle()"
                    (keydown.escape)="cancelTitle()"
                    (mousedown)="$event.stopPropagation()"
                />
            } @else {
                <span class="task-card__title" [class.task-card__title--complete]="task.isComplete" (dblclick)="startEditTitle($event)">
                    {{ localTitle }}
                </span>
                <button class="task-card__edit-hint" title="Edit title" (click)="startEditTitle($event)">
                    <i class="pi pi-pencil"></i>
                </button>
            }
        </div>
        <button class="task-card__drill-btn" title="Open" (click)="onDrillClick($event)">
            <i class="pi pi-arrow-right"></i>
        </button>
    </div>
    <div class="task-card__divider"></div>

    <div class="task-card__body-wrap">
        @if (editingDescription) {
            <textarea
                #descriptionInput
                class="task-card__body--editing"
                [(ngModel)]="localDescription"
                (blur)="commitDescription()"
                (keydown.escape)="cancelDescription()"
                (mousedown)="$event.stopPropagation()"
            ></textarea>
        } @else {
            <div class="task-card__body" (dblclick)="startEditDescription($event)">{{ localDescription }}</div>
            <button class="task-card__body-edit-hint" title="Edit description" (click)="startEditDescription($event)">
                <i class="pi pi-pencil"></i>
            </button>
        }
    </div>

    <div class="task-card__status-bar" style="display:flex;align-items:center;gap:4px;padding:4px 8px;background:rgba(0,0,0,0.12);border-top:1px solid rgba(0,0,0,0.2);flex-shrink:0;">
        <span class="task-card__stat" [class.task-card__stat--zero]="!counts?.directSubTasks" title="Direct sub-tasks">
            <i class="pi pi-list"></i>{{ counts?.directSubTasks ?? 0 }}
        </span>
        <span class="task-card__stat" [class.task-card__stat--zero]="!counts?.totalSubTasks" title="All sub-tasks (including nested)">
            <i class="pi pi-sitemap"></i>{{ counts?.totalSubTasks ?? 0 }}
        </span>
        <span class="task-card__stat" [class.task-card__stat--zero]="!counts?.directNotes" title="Notes">
            <i class="pi pi-file"></i>{{ counts?.directNotes ?? 0 }}
        </span>
    </div>

    @for (handle of resizeHandles; track handle) {
        <div
            class="resize-handle resize-handle--{{ handle }}"
            (mousedown)="onResizeMousedown($event, handle)"
        ></div>
    }
</div>
