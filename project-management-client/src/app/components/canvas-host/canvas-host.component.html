<div class="canvas-host">

    <!-- Toolbar -->
    <div class="canvas-toolbar">
        @if (isTaskCanvas) {
            <p-button icon="pi pi-arrow-left" [text]="true" size="small" (onClick)="goBack()" pTooltip="Back" tooltipPosition="right" appendTo="body" />
        }
        <span class="canvas-toolbar__title">{{ hostDisplayName }}</span>
        <div class="canvas-toolbar__spacer"></div>
        <p-button label="Fit All" icon="pi pi-expand" [text]="true" size="small" (onClick)="fitAll()" pTooltip="Zoom to fit all items" tooltipPosition="bottom" appendTo="body" />
        <p-button label="Edit" icon="pi pi-pencil" [text]="true" size="small" (onClick)="openEditDialog()" />
        <p-button icon="pi pi-trash" [text]="true" severity="danger" size="small" (onClick)="deleteHost()" pTooltip="Delete" tooltipPosition="left" appendTo="body" />
    </div>

    <!-- Main area: canvas + details pane -->
    <div class="canvas-host__body">
        <!-- Canvas area -->
        <div
            #canvasArea
            class="canvas-area"
            [ngStyle]="gridStyle"
            (mousedown)="onCanvasMousedown($event)"
            (wheel)="onCanvasWheel($event)"
            (click)="onCanvasClick()"
            (contextmenu)="onContextMenu($event)"
        >
            @if (loading) {
                <div class="canvas-loading">Loading…</div>
            } @else {
                <div class="canvas-container" [style.transform]="transform">

                    <!-- Origin marker — lives in canvas space so it pans/zooms with the view -->
                    <svg class="canvas-origin-marker" width="0" height="0">
                        <g fill="none" stroke="rgba(90,110,155,0.45)" stroke-width="1.2" stroke-linecap="round">
                            <line x1="-54" y1="0"   x2="52"  y2="0"/>
                            <line x1="-54" y1="-5"  x2="-54" y2="5"/>
                            <line x1="0"   y1="-54" x2="0"   y2="52"/>
                            <line x1="-5"  y1="-54" x2="5"   y2="-54"/>
                            <circle cx="0" cy="0" r="9"/>
                        </g>
                        <polygon points="58,0 51,-4 51,4"   fill="rgba(90,110,155,0.5)"/>
                        <polygon points="0,58 -4,51 4,51"   fill="rgba(90,110,155,0.5)"/>
                        <circle  cx="0" cy="0" r="2.5"      fill="rgba(90,110,155,0.65)"/>
                    </svg>

                    @for (group of groups; track group._id) {
                        <app-group-card
                            [group]="group"
                            [containedItems]="getGroupContainedItems(group)"
                            [selected]="isGroupSelected(group)"
                            (selected$)="onGroupSelected($event)"
                            (titleChanged$)="onGroupTitleChanged(group, $event)"
                            (layoutConfigChanged$)="onGroupLayoutConfigChanged(group, $event)"
                            (dragStarted$)="onGroupDragStarted(group, $event)"
                        />
                    }
                    @for (task of tasks; track task._id) {
                        <app-task-card
                            [task]="task"
                            [counts]="taskCounts[task._id]"
                            [selected]="isTaskSelected(task)"
                            (selected$)="onTaskSelected(task)"
                            (drillIn$)="onDrillIntoTask(task)"
                            (taskEdited$)="onTaskEdited(task, $event)"
                            (urgencyChanged$)="onTaskUrgencyChanged(task, $event)"
                            (projectToParentChanged$)="onTaskProjectToParentChanged(task, $event)"
                            (completeChanged$)="onTaskCompleteChanged(task, $event)"
                            (childCompletionChanged$)="onProjectedChildCompletionChanged(task, $event)"
                            (dragStarted$)="onTaskDragStarted(task, $event)"
                        />
                    }
                    @for (note of notes; track note._id) {
                        <app-note-card
                            [note]="note"
                            [selected]="isNoteSelected(note)"
                            (selected$)="onNoteSelected(note)"
                            (noteEdited$)="onNoteEdited(note, $event)"
                            (dragStarted$)="onNoteDragStarted(note, $event)"
                        />
                    }
                </div>
            }

            <!-- Rubber-band selection overlay — styled/positioned via direct DOM in onCanvasMousedown -->
            <div #rubberBandOverlay class="canvas-rubber-band" style="display:none;"></div>

            <app-canvas-context-menu
                [items]="contextMenuItems"
                [visible]="contextMenuVisible"
                [x]="contextMenuX"
                [y]="contextMenuY"
                (itemClicked$)="onContextMenuAction($event)"
                (dismissed$)="contextMenuVisible = false"
            />
        </div>

        <!-- Details pane -->
        <div class="details-pane-wrapper">
            <app-details-pane
                [hostProject]="hostProject"
                [hostTask]="hostTask"
            />
        </div>
    </div>
</div>

<!-- Host edit dialog -->
<p-dialog
    [header]="isTaskCanvas ? 'Edit Task' : 'Edit Project'"
    [(visible)]="showEditDialog"
    [modal]="true"
    [style]="{ width: '420px' }"
    appendTo="body"
>
    <div class="dialog-form">
        <div class="field">
            <label>{{ isTaskCanvas ? 'Title' : 'Name' }} <span class="required">*</span></label>
            <input pInputText [(ngModel)]="editName" class="w-full" />
        </div>
        <div class="field">
            <label>Description</label>
            <textarea pTextarea [(ngModel)]="editDescription" class="w-full" rows="3"></textarea>
        </div>
    </div>
    <ng-template pTemplate="footer">
        <p-button label="Cancel" [text]="true" (onClick)="showEditDialog = false" />
        <p-button label="Save" icon="pi pi-check" [disabled]="!editName.trim()" (onClick)="saveEdit()" />
    </ng-template>
</p-dialog>

<p-confirmDialog appendTo="body" />
