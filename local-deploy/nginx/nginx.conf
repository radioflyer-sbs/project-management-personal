worker_processes 1;

events {
    worker_connections 512;
}

http {
    # Use Docker's internal DNS resolver; re-resolve every 10s so container
    # IP changes after a rebuild don't leave nginx with stale addresses.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;

        # REST API — forwarded to the Express server
        location /api/ {
            set $upstream_server pm-server:1089;
            proxy_pass         http://$upstream_server;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Socket.IO — requires HTTP upgrade for WebSocket transport
        location /socket.io/ {
            set $upstream_server pm-server:1089;
            proxy_pass         http://$upstream_server;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 3600s;
        }

        # Angular SPA — everything else goes to the client container
        location / {
            set $upstream_client pm-client:80;
            proxy_pass       http://$upstream_client;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
